[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# local-only: never download compilers or touch the network
offline = true

[fuzz]
runs = 1000

[lint]
# round timing is timestamp-based by design (lock, fight delay, settle timeout)
exclude_lints = ["block-timestamp"]

# No [rpc_endpoints] on purpose. Nothing in this project talks to a chain.
