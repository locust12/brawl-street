# THE SINGAPORE VARIANT (restored 10/17, AAA4).
# net/deploy.sh rsyncs compose.yml to whatever box it is deploying to, and the lw file declares the
# external "sinbook" network that only exists on lw. Pushing it to sg replaced sg's own compose and
# `docker compose up` there failed with "network sinbook declared as external, but could not be
# found" -- the running container survived, so sg kept serving, but it could no longer be deployed.
# Reconstructed from `docker inspect` of the two containers that were already running there.
# deploy.sh now picks this file when DEPLOY_HOST=sg.
# Brawlstreet online on the lw box (/opt/brawlstreet). Caddy (container "caddy", same "sinbook"
# network) serves https://brawlstreet.167-233-230-149.sslip.io and proxies it to this container.
# Real-money mode stays OFF unless REAL_MONEY=1 and the chain settings are put in .env (see README.md).
services:
  brawlstreet:
    build: .
    image: brawlstreet:latest
    container_name: brawlstreet
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: https://brawlstreet.5-223-91-79.sslip.io
      # Which box this is. The page measures the round trip to every region in REGIONS and plays on the
      # closest one, so when a second box goes up (e.g. Singapore) set REGIONS to the same JSON list on
      # BOTH boxes and nothing else changes:
      #   REGIONS: '[{"id":"eu","label":"Germany","ws":"wss://brawlstreet.167-233-230-149.sslip.io/ws","http":"https://brawlstreet.167-233-230-149.sslip.io"},
      #              {"id":"sg","label":"Singapore","ws":"wss://<sg-host>/ws","http":"https://<sg-host>"}]'
      # With REGIONS unset the server advertises only itself (from PUBLIC_URL).
      # THIS BOX IS SINGAPORE. The lw compose hardcodes these three, and sg's .env does not
      # override them, so a compose copied from lw makes sg advertise itself as eu -- which is
      # exactly what happened on the first restore at 10/17 11:05 and had to be put back.
      REGION: sg
      REGION_LABEL: Singapore
      REGIONS: '[{"id":"eu","label":"Germany","ws":"wss://brawlstreet.167-233-230-149.sslip.io/ws","http":"https://brawlstreet.167-233-230-149.sslip.io"},{"id":"sg","label":"Singapore","ws":"wss://brawlstreet.5-223-91-79.sslip.io/ws","http":"https://brawlstreet.5-223-91-79.sslip.io"}]'
    volumes:
      - ./engine:/app/engine:ro
      - ./public:/app/public:ro
      - brawlstreet-data:/data
    networks: [brawl]
    # No ports: are published on purpose. The only way in is Caddy on the sinbook network, which is
    # what makes the X-Forwarded-For handling trustworthy. Do not add a ports: mapping.
    #
    # Containment: this box runs other projects, so a runaway or exploited game server must not be
    # able to take the host with it.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1500m
    memswap_limit: 1500m
    pids_limit: 512
    ulimits:
      nofile: { soft: 4096, hard: 8192 }
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }
  # SINGAPORE RUNS ITS OWN CADDY. On lw, Caddy is a container owned by another project and the game
  # joins it on the external "sinbook" network. The sg box has no sinbook network and no other
  # project: it brings its own Caddy up in this same compose file, on a network this file owns.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [brawl]

volumes:
  brawlstreet-data:
  caddy-data:
  caddy-config:
networks:
  brawl:
